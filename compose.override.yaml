services:
  api:
    build:
      target: dev
    image: porra-api:dev
    environment:
      PORRA_TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/porra_test
    volumes:
      - ./services/api/src:/app/src
      - ./services/api/tests:/app/tests
      - ./services/api/migrations:/app/migrations
      - ./services/api/alembic.ini:/app/alembic.ini:ro
    command: ["uvicorn", "porra_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    ports:
      - "5432:5432"
    volumes:
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro

  worker:
    build:
      target: dev
    image: porra-api:dev
    volumes:
      - ./services/api/src:/app/src

  ingestor:
    build:
      target: dev
    image: porra-api:dev
    volumes:
      - ./services/api/src:/app/src