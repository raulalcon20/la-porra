[project]
name = "porra-api"
version = "0.1.0"
description = "API REST de La Porra: jugadores, jornadas, pronósticos y clasificación"
readme = "README.md"
authors = [
    { name = "raulalcon20", email = "raulalcon20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]